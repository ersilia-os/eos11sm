name: Try Apptainer build

# Test only: lives on the apptainer-test branch. No changes to main
on:
  push:
    branches:
      - apptainer-test

jobs:
  build-sif:
    uses: ersilia-os/ersilia-model-workflows/.github/workflows/build-upload-sif.yml@apptainer-sif
    with:
      repo_name: eos11sm
      version: v1.0.1
      runner: ubuntu-latest
      dry_run: false
      scripts_ref: apptainer-sif
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
