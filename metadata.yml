Identifier: eos11sm
Slug: known-antibiotic-resemblance
Status: Ready
Title: Resemblance to a curated list of known antibiotics
Description: Measures how closely a compound resembles established antibacterial drugs,
  benchmarked against a curated reference of roughly 600 known antibiotics drawn from
  AntibioticDB and the Collins laboratory at MIT. The score is intended for triage,
  letting compounds structurally remote from any known antibiotic be set aside or,
  conversely, deliberately sought when novel chemotypes are the goal. Resemblance
  to existing antibiotics is a statement about structure and carries no prediction
  of antibacterial activity.
